# Lint settings shared by local runs and CI (ruff check agent tests scripts).
line-length = 120
target-version = "py310"
extend-exclude = [".build", ".runs", ".cache", ".evals", "web"]

[lint]
select = ["E", "F", "W", "B"]
# Prompts, labels and test fixtures hold long natural-language strings on purpose.
ignore = ["E501"]
