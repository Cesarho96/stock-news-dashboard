name: ci-deploy

# Tests on every push/PR. Deploys main when the repository variable AWS_DEPLOY_ROLE_ARN is set
# (GitHub OIDC role). Optional variables: AWS_REGION, STACK_NAME, RUNNER_LABEL (e.g. self-hosted).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: node --test tests/web/renderer.test.mjs

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    concurrency: deploy-main
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: Deploy stack and site
        run: bash scripts/deploy.sh
        env:
          STACK_NAME: ${{ vars.STACK_NAME || 'stock-news-dashboard' }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
