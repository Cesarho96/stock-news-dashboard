name: ci

# Fast checks on every pull request and branch push (and reused by the release workflow):
# lint, unit tests (agent, quality gate, judge, evals, rollback logic), renderer tests and the
# CloudFormation/SAM template checks. No AWS credentials needed.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: lint, tests, templates
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - run: ruff check agent tests scripts
      - run: python -m pytest
      - run: node --test tests/web/renderer.test.mjs
      - run: python scripts/deploy.py validate
