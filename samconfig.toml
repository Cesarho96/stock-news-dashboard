# Deployments go through scripts/deploy.py (or the GitHub release workflow), which passes every
# option explicitly: stack name per environment (stock-news-dashboard-dev / -prod), parameters
# from infra/params/<env>.json, the artifacts bucket and the CloudFormation execution role.
# Only shared defaults live here; keep deploy options out of this file so they cannot conflict.
version = 0.1

[default.global.parameters]
region = "us-east-1"

[default.validate.parameters]
lint = true
